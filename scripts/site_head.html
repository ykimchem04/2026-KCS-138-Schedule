<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#003F87">
<title>KCS 138 일정</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Follows the society's own site: Noto Sans KR throughout, navy on white,
   bordered tables with a pale blue header tint, pill day tabs. Two layouts,
   not one that stretches - a phone gets a list under a bottom tab bar, a desktop
   gets the hall-by-hall grid the printed programme uses. */
:root{
  --navy:#003F87; --blue:#2367B2; --blue-soft:#EBF3F9;
  --bg:#FFFFFF; --panel:#FFFFFF; --tint:#F7F8FA; --inactive:#F2F2F2;
  --ink:#191A1C; --ink-2:#333333; --ink-3:#666666; --ink-4:#8C9196;
  --line:#DEE2E6; --line-2:#EDEFF2;
  --warn:#B3261E; --warn-soft:#FBEAE9;
  --hl:#FFF3BF; --hl-ink:#191A1C;
  --sans:'Noto Sans KR',-apple-system,BlinkMacSystemFont,'Malgun Gothic',sans-serif;
  --tabh:56px; --maxw:1340px;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink); font-family:var(--sans);
  font-size:15px; line-height:1.55; -webkit-text-size-adjust:100%;
  padding-bottom:calc(var(--tabh) + env(safe-area-inset-bottom,0px));
}
.wrap{max-width:var(--maxw);margin:0 auto;padding:0 16px}

/* ---------- masthead ---------- */
header.top{
  position:sticky;top:0;z-index:30;background:var(--panel);
  border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px);
}
.top-in{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:10px 0}
.brand{display:flex;align-items:baseline;gap:9px;min-width:0}
.brand .mark{
  font-weight:700;font-size:15px;color:var(--navy);letter-spacing:.02em;flex:none;
}
.brand .ttl{font-size:14px;font-weight:500;color:var(--ink-2);white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis}
.top .meta{font-size:12px;color:var(--ink-3);white-space:nowrap;flex:none}
/* desktop nav lives in the masthead; the phone uses the bar at the bottom */
.topnav{display:none;gap:2px}
.topnav button{
  font:inherit;font-size:14px;font-weight:500;cursor:pointer;color:var(--ink-2);
  background:none;border:0;border-bottom:2px solid transparent;padding:9px 14px;
}
.topnav button:hover{color:var(--navy)}
.topnav button[aria-selected="true"]{color:var(--navy);font-weight:700;border-bottom-color:var(--navy)}

main{padding:18px 0 28px}
.page-h{
  display:flex;align-items:baseline;justify-content:space-between;gap:12px;
  margin:0 0 4px;flex-wrap:wrap;
}
.page-h h2{font-size:20px;font-weight:700;margin:0;letter-spacing:-.01em}
.page-h .count{font-size:13px;color:var(--ink-3)}
.lede{font-size:13px;color:var(--ink-3);margin:0 0 16px}
h3.sub{
  font-size:13px;font-weight:700;color:var(--ink-2);margin:22px 0 9px;
  padding-bottom:7px;border-bottom:1px solid var(--line);
}
h3.sub:first-child{margin-top:0}
h3.sub .n{float:right;font-weight:500;color:var(--ink-3);font-size:12px}
.empty{color:var(--ink-3);font-size:14px;padding:34px 0;text-align:center}

/* ---------- pill tabs (society convention) ---------- */
.pills{display:flex;gap:6px;margin:0 0 16px;flex-wrap:wrap}
.pills button{
  font:inherit;font-size:13px;font-weight:500;cursor:pointer;
  background:var(--inactive);color:var(--ink-2);border:0;border-radius:10px;
  padding:9px 15px;min-height:42px;
}
.pills button[aria-pressed="true"]{background:var(--blue);color:#fff;font-weight:600}

/* ---------- list rows (phone) ---------- */
.rows{border-top:1px solid var(--line)}
.row{
  display:grid;grid-template-columns:3px 1fr auto;gap:0 11px;align-items:start;
  border-bottom:1px solid var(--line-2);background:var(--panel);
}
.row>.bar{background:var(--dc,var(--line));align-self:stretch}
.row>.main{padding:11px 0;min-width:0;text-align:left}
.row .line1{
  display:flex;flex-wrap:wrap;gap:3px 10px;align-items:baseline;
  font-size:12px;color:var(--ink-3);font-variant-numeric:tabular-nums;
}
.row .code{color:var(--navy);font-weight:700}
.row .hall{color:var(--ink-2);font-weight:600}
.row .ttl{
  font-size:14px;line-height:1.45;margin:3px 0 0;font-weight:500;color:var(--ink);
  display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;
}
.row .who{font-size:12.5px;color:var(--ink-3);margin-top:3px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row.on{background:var(--blue-soft)}
.open{all:unset;cursor:pointer;display:block;width:100%}
.tag{
  display:inline-block;font-size:11px;font-weight:600;padding:1px 6px;border-radius:3px;
  background:var(--blue-soft);color:var(--navy);
}
.tag.live{background:var(--navy);color:#fff}
.tag.clash{background:var(--warn-soft);color:var(--warn)}
/* 44px of target, pulled back so the row keeps its height */
.star{
  flex:none;font:inherit;font-size:18px;line-height:1;background:none;border:0;cursor:pointer;
  color:var(--line);min-width:44px;min-height:44px;display:flex;align-items:center;
  justify-content:center;margin:-6px -8px -6px 0;border-radius:4px;
}
.star[data-on="1"]{color:var(--blue)}

/* ---------- next-up panel ---------- */
.next{
  border:1px solid var(--navy);border-radius:5px;background:var(--blue-soft);
  padding:12px 14px;margin:0 0 18px;
}
.next .k{font-size:11.5px;font-weight:700;color:var(--navy);letter-spacing:.02em}
.next .v{font-size:15px;font-weight:600;margin:4px 0 2px;line-height:1.4}
.next .m{font-size:12.5px;color:var(--ink-3);font-variant-numeric:tabular-nums}

/* ---------- tables (desktop; the society's own shape) ---------- */
.tablewrap{border:1px solid var(--line);border-radius:5px;overflow:auto}
table.grid{border-collapse:collapse;width:100%;font-size:12.8px}
table.grid th,table.grid td{
  border:1px solid var(--line);padding:9px 10px;text-align:center;vertical-align:top;
}
table.grid thead th{
  background:var(--blue-soft);font-weight:600;color:var(--ink);position:sticky;top:0;z-index:2;
  white-space:nowrap;
}
table.grid td.time{
  background:var(--tint);font-weight:600;color:var(--ink-2);white-space:nowrap;
  font-variant-numeric:tabular-nums;width:72px;
}
table.grid td.slotcell{padding:0}
table.grid td.free{background:transparent}
.block{
  display:block;width:100%;height:100%;text-align:left;font:inherit;color:inherit;
  background:none;border:0;border-left:3px solid var(--dc,var(--blue));cursor:pointer;
  padding:8px 9px;
}
.block:hover{background:var(--blue-soft)}
.block .bc{font-size:11.5px;font-weight:700;color:var(--navy);font-variant-numeric:tabular-nums}
.block .bt{font-size:12.5px;line-height:1.4;margin:2px 0 0;
  display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.block .bm{font-size:11.5px;color:var(--ink-3);margin-top:3px}
table.list{border-collapse:collapse;width:100%;font-size:13px}
table.list th{
  background:var(--blue-soft);font-weight:600;padding:9px 10px;text-align:left;
  border-bottom:1px solid var(--line);white-space:nowrap;font-size:12.5px;
}
table.list td{border-bottom:1px solid var(--line-2);padding:9px 10px;vertical-align:top}
table.list tr:hover td{background:var(--tint)}
table.list .c-time{white-space:nowrap;font-variant-numeric:tabular-nums;color:var(--ink-2);width:1%}
table.list .c-code{white-space:nowrap;color:var(--navy);font-weight:700;width:1%}
table.list .c-hall{white-space:nowrap;color:var(--ink-2);width:1%}
table.list .c-star{width:1%;text-align:center}
table.list .t{font-weight:500}
table.list .a{font-size:12px;color:var(--ink-3);margin-top:2px}

/* ---------- search ---------- */
.searchrow{display:flex;gap:8px;margin:0 0 10px;flex-wrap:wrap}
.searchbox{
  flex:1 1 260px;min-width:0;display:flex;align-items:center;gap:8px;background:var(--panel);
  border:1px solid var(--line);border-radius:5px;padding:10px 12px;
}
.searchbox:focus-within{border-color:var(--blue)}
.searchbox input{flex:1;min-width:0;border:0;background:none;font:inherit;font-size:15px;color:var(--ink);outline:none}
.searchbox svg{flex:none;color:var(--ink-4)}
.hits{font-size:12.5px;color:var(--ink-3);margin:0 0 10px}
mark{background:var(--hl);color:var(--hl-ink);padding:0 1px;border-radius:2px}

/* ---------- plan ---------- */
.planbar{
  display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;
  border:1px solid var(--line);border-radius:5px;background:var(--tint);
  padding:11px 13px;margin:0 0 14px;font-size:13px;
}
.btn{
  font:inherit;font-size:13px;font-weight:600;cursor:pointer;border-radius:5px;
  padding:9px 14px;border:1px solid var(--line);background:var(--panel);color:var(--ink-2);min-height:42px;
}
.btn:hover{border-color:var(--blue);color:var(--navy)}
.btn.primary{background:var(--navy);border-color:var(--navy);color:#fff}
.notice{
  border:1px solid var(--line);border-left:3px solid var(--navy);border-radius:3px;
  background:var(--tint);padding:10px 13px;margin:0 0 14px;font-size:13px;
}
.notice.bad{border-left-color:var(--warn);background:var(--warn-soft)}
.notice.bad b{color:var(--warn)}
.linkrow{display:flex;gap:8px;margin:10px 0 0;flex-wrap:wrap}
.linkrow input{
  flex:1 1 240px;min-width:0;font:inherit;font-size:12px;color:var(--ink-3);
  background:var(--tint);border:1px solid var(--line);border-radius:5px;padding:10px 11px;
}

/* ---------- detail ---------- */
dialog.sheet{
  border:1px solid var(--line);padding:0;background:var(--panel);color:var(--ink);
  width:min(680px,100%);max-width:100%;max-height:88vh;border-radius:5px 5px 0 0;margin:auto auto 0;
}
dialog.sheet::backdrop{background:rgba(10,20,34,.45)}
.sheet-in{padding:16px 16px calc(22px + env(safe-area-inset-bottom,0px));overflow-y:auto;max-height:88vh}
.sheet h3{font-size:17px;line-height:1.4;margin:4px 0 10px;font-weight:700}
.sheet .abs{font-size:13.5px;line-height:1.75;color:var(--ink-2);white-space:pre-wrap;margin:14px 0 0}
.sheet dl{display:grid;grid-template-columns:auto 1fr;gap:7px 14px;margin:12px 0 0;font-size:13px;
  border-top:1px solid var(--line-2);padding-top:12px}
.sheet dt{font-size:12px;color:var(--ink-3);white-space:nowrap}
.sheet dd{margin:0;color:var(--ink)}
.sheet .acts{display:flex;gap:8px;margin:12px 0 0}

/* ---------- bottom bar (phone only) ---------- */
nav.tabs{
  position:fixed;left:0;right:0;bottom:0;z-index:40;
  display:grid;grid-template-columns:repeat(6,1fr);
  border-top:1px solid var(--line);background:var(--panel);
  padding:5px 2px calc(5px + env(safe-area-inset-bottom,0px));
}
nav.tabs button{
  font:inherit;background:none;border:0;cursor:pointer;color:var(--ink-4);
  display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px 2px;
  font-size:10px;font-weight:500;min-height:46px;letter-spacing:-.02em;
}
nav.tabs button svg{width:20px;height:20px}
nav.tabs button[aria-selected="true"]{color:var(--navy);font-weight:700}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}

/* ================= desktop ================= */
@media (min-width:1024px){
  body{font-size:15px;padding-bottom:0}
  nav.tabs{display:none}
  .topnav{display:flex}
  .top-in{padding:0}
  .brand{padding:12px 0}
  .brand .ttl{font-size:15px}
  main{padding:24px 0 48px}
  .page-h h2{font-size:24px}
  .phone-only{display:none!important}
}
@media (max-width:1023px){ .desk-only{display:none!important} }
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<header class="top"><div class="wrap top-in">
  <div class="brand">
    <span class="mark">KCS 138</span>
    <span class="ttl" id="brandTtl">대한화학회 제138회 학술발표회</span>
  </div>
  <nav class="topnav" role="tablist" aria-label="화면"></nav>
  <span class="meta" id="meta"></span>
</div></header>

<main class="wrap">
  <section class="screen" id="s-now"></section>
  <section class="screen" id="s-sched" hidden></section>
  <section class="screen" id="s-find" hidden></section>
  <section class="screen" id="s-plan" hidden></section>
  <section class="screen" id="s-talks" hidden></section>
  <section class="screen" id="s-poster" hidden></section>
</main>

<dialog class="sheet" id="sheet"><div class="sheet-in" id="sheetIn"></div></dialog>

<nav class="tabs" role="tablist" aria-label="주요 화면">
  <button role="tab" aria-selected="true" data-s="now">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7.5V12l3 2"/></svg>지금</button>
  <button role="tab" aria-selected="false" data-s="sched">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="3.5" y="5" width="17" height="15" rx="2"/><path d="M3.5 9.5h17M8 3.5v3M16 3.5v3"/></svg>일정</button>
  <button role="tab" aria-selected="false" data-s="find">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"/><path d="M19.5 19.5L16 16"/></svg>검색</button>
  <button role="tab" aria-selected="false" data-s="plan">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"><path d="M12 4.5l2.3 4.9 5.2.7-3.8 3.7.9 5.2-4.6-2.5-4.6 2.5.9-5.2-3.8-3.7 5.2-.7z"/></svg>내 일정</button>
  <button role="tab" aria-selected="false" data-s="talks">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5.5h7a2 2 0 0 1 2 2v11a1.6 1.6 0 0 0-1.6-1.6H4z"/><path d="M20 5.5h-7a2 2 0 0 0-2 2v11a1.6 1.6 0 0 1 1.6-1.6H20z"/></svg>강연</button>
  <button role="tab" aria-selected="false" data-s="poster">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="4" y="3.5" width="16" height="13" rx="1.5"/><path d="M9 20.5h6M12 16.5v4"/></svg>포스터</button>
</nav>
